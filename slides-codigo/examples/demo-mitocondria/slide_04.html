<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="engine/styles/base.css">
<link rel="stylesheet" href="engine/styles/minimalista_linea.css">
<script src="engine/vendor/gsap.min.js"></script>
<script src="engine/vendor/DrawSVGPlugin.min.js"></script>
<script src="engine/vendor/SplitText.min.js"></script>
<script src="engine/runtime.js"></script>
<style>
  .seg  { fill: none; stroke-width: 52; }
  .num  { font-family: var(--font-title); font-weight: 300; font-size: 64px; line-height: 1; }
</style>
</head><body>
<!-- SLIDE 04 · DATOS · off-white · dona que gira revelando + leyenda que cuenta -->
<div id="stage">
  <div id="title" class="abs t-title" style="left:64px;top:44px">ADN mitocondrial humano</div>

  <svg class="abs" style="left:0;top:0" width="1280" height="720" viewBox="0 0 1280 720">
    <circle id="guia" class="line thin" cx="330" cy="400" r="190"/>
    <g id="ticks"></g>
    <g transform="rotate(-90 330 400)">
      <g id="ring" data-cx="330" data-cy="400">
        <circle id="s1" class="seg" cx="330" cy="400" r="150" stroke="#2E5BFF"/>
        <circle id="s2" class="seg" cx="330" cy="400" r="150" stroke="#A93DF5"/>
        <circle id="s3" class="seg" cx="330" cy="400" r="150" stroke="#FF5B35"/>
      </g>
    </g>
    <rect id="w1" x="700" y="226" width="22" height="22" fill="#2E5BFF"/>
    <rect id="w2" x="700" y="336" width="22" height="22" fill="#A93DF5"/>
    <rect id="w3" x="700" y="446" width="22" height="22" fill="#FF5B35"/>
  </svg>

  <div id="centro" class="abs t-hero" style="left:250px;top:330px;width:160px;text-align:center;font-size:110px">37</div>
  <div id="centro-t" class="abs t-label" style="left:250px;top:446px;width:160px;text-align:center">genes</div>

  <div id="n1" class="abs num" style="left:740px;top:206px">13</div>
  <div id="n2" class="abs num" style="left:740px;top:316px">22</div>
  <div id="n3" class="abs num" style="left:740px;top:426px">2</div>
  <div id="g1" class="abs t-label" style="left:840px;top:204px;width:360px">proteínas de la cadena respiratoria</div>
  <div id="g2" class="abs t-label" style="left:840px;top:330px;width:360px">ARN de transferencia</div>
  <div id="g3" class="abs t-label" style="left:840px;top:440px;width:360px">ARN ribosómico</div>

  <div id="pb" class="abs num" style="left:700px;top:528px;color:var(--line)">16.569</div>
  <div id="pb-t" class="abs t-label" style="left:700px;top:598px">pares de bases, genoma circular</div>
  <div id="foot" class="abs t-caption" style="left:700px;top:660px">Anderson et al., 1981</div>
  <div id="spine" class="abs" style="left:1236px;top:150px;writing-mode:vertical-rl;font-size:21px;letter-spacing:.32em;font-weight:500">HERENCIA MATERNA</div>
</div>
<script>
// 37 genes = 13 + 22 + 2 (Anderson et al., 1981). Sectores en % de la vuelta, con 0.8 % de separación.
const G = [13, 22, 2], T = G.reduce((a, b) => a + b, 0);
if (T !== 37) throw new Error("los genes no suman 37");
let acc = 0; const SEGS = G.map((g) => { const a = acc / T * 100, b = (acc += g) / T * 100; return [a + 0.4, b - 0.4]; });
(() => {  // marcas cada 10 % en el anillo guía
  const NS = "http://www.w3.org/2000/svg", tk = document.getElementById("ticks");
  for (let i = 0; i < 20; i++) { const a = -Math.PI / 2 + i * Math.PI / 10, p = document.createElementNS(NS, "path");
    p.setAttribute("class", "line thin"); p.setAttribute("d", `M${330 + 184 * Math.cos(a)} ${400 + 184 * Math.sin(a)} L${330 + 196 * Math.cos(a)} ${400 + 196 * Math.sin(a)}`); tk.appendChild(p); }
})();
SC.build((S) => {
  S.drop("#title", 0.2, { stagger: 0.03 });
  // Etapa 1 — guía, dona que gira revelando y cifra central que cuenta
  S.draw("#guia", 0.8, { dur: 0.9 });
  S.draw("#ticks path", 1.2, { dur: 0.2, stagger: 0.03 });
  S.ring("#ring", "#s1, #s2, #s3", SEGS, 1.4, { dur: 2.0, turn: 320 });
  S.count("#centro", 37, 1.8, { dur: 1.8 });
  S.type("#centro-t", 3.4, { letter: 0.05 });
  // Etapa 2 — leyenda: cada fila con su muestra, su cifra que cuenta y su nombre tecleado
  [1, 2, 3].forEach((k, i) => {
    const t = 3.8 + i * 0.75;
    S.pop(`#w${k}`, t);
    S.count(`#n${k}`, G[i], t + 0.1, { dur: 0.9, punch: false });
    S.type(`#g${k}`, t + 0.3, { letter: 0.022 });
  });
  S.count("#pb", 16569, 6.3, { dur: 1.6 });
  S.type("#pb-t", 7.0, { letter: 0.025 });
  S.drop("#spine", 8.0, { stagger: 0.03 });
  S.type("#foot", 8.8, { letter: 0.03 });
});
</script>
</body></html>
